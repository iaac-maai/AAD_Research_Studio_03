# Runs on every pull request and on pushes to main: lint + tests.
# No torch or ultralytics here: the tests cover the parts that don't need the model.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Face model (for the privacy test)
        run: python -m concrete_evidence.privacy --fetch
      - name: Tests
        run: python -m pytest -rs
