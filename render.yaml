# Render Blueprint: the model server (02_model_server/app.py). render.com -> New -> Blueprint -> this repo.
# Python comes from .python-version (3.13). Free plan: 512 MB, sleeps after 15 min, ~1 min to wake.
services:
  - type: web
    name: concrete-evidence-model
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r 02_model_server/requirements.txt
    startCommand: python 02_model_server/app.py
    healthCheckPath: /
    envVars:
      - key: MODEL_REPO          # Hugging Face repo with the ONNX model: Diego's rebar model (trained 23 Nov)
        value: iaac-maai/concrete-evidence-rebar
      - key: MODEL_FILE          # the file in that repo
        value: best.onnx
      - key: CLASS_RENAME        # the model says stirrup, the checker says tie
        value: stirrup=tie
      - key: HF_HOME
        value: /tmp/hf
