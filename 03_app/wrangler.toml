# Concrete Evidence app on Cloudflare Pages: the page (public/) + the API (functions/) + D1 + R2
name = "concrete-evidence"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

[vars]
# The model server on Render (render.yaml at the repo root), no slash at the end.
# Locally, .dev.vars sets MODEL_URL=http://127.0.0.1:7860 instead.
MODEL_URL = "https://concrete-evidence-model.onrender.com"
MODEL_API_NAME = "predict"

# One row per check: `npx wrangler d1 create concrete-evidence-db` prints the id to paste here
[[d1_databases]]
binding = "DB"
database_name = "concrete-evidence-db"
database_id = "paste-the-id-from-wrangler-d1-create"

# The checked photos (faces blurred) and full results: `npx wrangler r2 bucket create concrete-evidence-photos`
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "concrete-evidence-photos"

# The password is NOT here: it is a secret.
#   Locally: APP_PASSWORD=... in .dev.vars (gitignored)
#   Online:  npx wrangler pages secret put APP_PASSWORD
