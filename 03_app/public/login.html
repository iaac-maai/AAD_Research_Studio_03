<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concrete Evidence · Sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login">
  <main class="login-box">
    <h1>Concrete Evidence</h1>
    <p class="muted">Rebar check before the pour.</p>
    <form method="post" action="/api/login">
      <label for="password">Team password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p id="wrong" class="error" hidden>That password isn't right. Try again.</p>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("wrong")) document.getElementById("wrong").hidden = false;
  </script>
</body>
</html>
